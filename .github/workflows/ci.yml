name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Windows is the development and launch platform, so that is what CI verifies.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # The cut tests run real ffmpeg; without it they would be skipped.
      - run: choco install ffmpeg --no-progress -y
      # Duplicate detection needs ffmpeg's Chromaprint muxer; its tests skip without it.
      - run: if (-not (ffmpeg -hide_banner -muxers | Select-String ' chromaprint ')) { throw "ffmpeg lacks Chromaprint" }
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest

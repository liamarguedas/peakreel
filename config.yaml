# Peakreel configuration: portable defaults.
#
# Machine-specific values (absolute tool paths, another data directory, your channel list)
# go in config.local.yaml next to this file. That file is gitignored and is deep-merged on
# top of this one: mappings merge key by key, lists and scalars are replaced.
#
# Relative paths are resolved against the directory that contains this file.

tools:
  # A bare command name is looked up next to the Python interpreter first (the project
  # virtualenv), then on PATH. `peakreel doctor` prints the resolved path.
  # Set absolute paths in config.local.yaml to pin exact binaries.
  ffmpeg: ffmpeg
  ffprobe: ffprobe
  streamlink: streamlink
  whisper_model_dir: models/whisper

paths:
  data_dir: data
  blocklist: blocklist.yaml

# Channels to watch. `credit` is the text burned into every clip from that channel.
# `facecam` (optional) switches the vertical render to a split layout: the facecam
# region, as fractions of the source frame, on top of the gameplay.
# Example:
#   - name: somestreamer
#     credit: "Clip from twitch.tv/somestreamer"
#     facecam: {x: 0.80, y: 0.58, w: 0.20, h: 0.32}
#     enabled: true              # false keeps it configured but not run
#     display_name: SomeStreamer # how posts name them (default: the login)
#     handles:                   # their accounts, for @mentions; never guessed
#       tiktok: somestreamer
#       youtube: somestreamer
#       instagram: somestreamer
#     hashtags: [someStreamer]   # added to every clip of this channel
#     language: en               # what they speak (ISO 639-1); picks your posting account
#     platform: kick             # for a Kick channel (name = its slug); default twitch
#     permission: unknown        # granted | credit_only | unknown (not asked yet)
channels: []

chat:
  url: wss://irc-ws.chat.twitch.tv:443
  # Messages from these logins are flagged `filtered: bot` (still logged, so they replay).
  bots:
    - nightbot
    - streamelements
    - streamlabs
    - moobot
    - fossabot
    - wizebot
    - soundalerts
    - sery_bot
    - pokemoncommunitygame
    - botrixoficial
    - kofistreambot
    - tangiabot
    - blerp
    - own3d
  # Messages starting with one of these are flagged `filtered: command`.
  command_prefixes: ["!"]
  # Liveness: a websocket ping every `keepalive_interval_s`; no pong within
  # `keepalive_timeout_s` marks the connection stalled and forces a reconnect.
  # interval + timeout is the longest an outage can go unnoticed.
  keepalive_interval_s: 2.0
  keepalive_timeout_s: 3.0
  connect_timeout_s: 5.0
  # Reconnect backoff: initial * 2^attempt, capped at max, with jitter.
  reconnect_initial_delay_s: 0.5
  reconnect_max_delay_s: 8.0
  # Twitch allows 20 JOINs per 10 seconds for unauthenticated connections.
  join_batch_size: 20
  join_batch_interval_s: 10.5

# Spike detector (M2). Tune with `peakreel detect evaluate`; see docs/m2-detector.md.
detect:
  bucket_s: 10
  baseline_buckets: 30        # 5 min rolling baseline
  warmup_buckets: 12          # 2 min of data before anything can trigger
  floor: 10                   # messages per bucket, minimum
  k: 4.0                      # hot when count > median + k * MAD
  min_unique: 5
  merge_gap: 1
  max_event_s: 120
  cooldown_s: 60
  raid_suppress_s: 90
  sub_train_min: 5
  sub_train_window_s: 30
  min_unique_ratio: 0.3
  reset_after_downtime_s: 300
  top_messages: 5
  # Permissive overrides that build the label sheet (a superset of stricter settings).
  candidate:
    floor: 5
    k: 2.0
    min_unique: 3
    cooldown_s: 30

# Stream recorder and rolling buffer (M3). See docs/m3-recorder.md.
record:
  buffer_minutes: 10          # on the broadcast clock, per channel
  quality: best               # 1080p60 is ~1 MB/s, so ~600 MB per channel at 10 min
  offline_retry_s: 30
  prune_interval_s: 30

# Live clipper (M4). See docs/m4-clipper.md.
clip:
  pre_roll_s: 20              # video before the spike start (chat reacts late)
  post_roll_s: 10
  max_wait_s: 90              # wait this long for the buffer to cover the window
  concurrent_cuts: 1          # ffmpeg encodes at once
  outbox: outbox              # under paths.data_dir
  max_per_hour: 3             # clip budget per channel and rolling hour (null: none);
                              # busy chats spike 8-12 times an hour
  keep_score: 10              # clipped even over budget (about the top 10% of spikes)

# Vertical renderer (M5). See docs/m5-renderer.md.
render:
  font_file: null             # null = first installed CJK-capable font (Yu Gothic, Malgun, ...)
  font_name: null             # family name of a custom font_file, for captions
  preset: veryfast
  crf: 20
  audio_bitrate: 160k
  blur_sigma: 30
  facecam_height_fraction: 0.35   # split layout: facecam share of the height
  credit_max_font_px: 42
  margin_px: 48

# Speech captions (M6). See docs/m6-captions.md.
# Download the model once with `peakreel captions download`.
captions:
  enabled: true
  model: small                # faster-whisper; cached in tools.whisper_model_dir
  device: cpu
  compute_type: int8
  cpu_threads: 4              # leave cores for recording and encoding
  beam_size: 5                # greedy (1) drops whole segments on noisy game audio
  language: null              # null = detect per clip
  vad_filter: true
  min_words: 3                # fewer = "no speech", clip renders without captions
  max_line_chars: 20          # CJK characters count 2
  font_px: 64
  outline_px: 5
  highlight_color: "#FFE135"
  bottom_fraction: 0.70       # caption baseline; above the credit and the unsafe zone
  side_margin_px: 48
  linger_s: 0.3

# Supervision of `peakreel run start` (M7). See docs/m7-supervisor-review.md.
supervisor:
  require_allowlist: true     # only channels listed above (enabled) may run
  restart_initial_s: 5        # backoff for restarting a crashed channel component
  restart_max_s: 300
  blocklist_check_s: 30       # takedowns apply while running
  status_interval_s: 30       # data/run/status.json heartbeat

# Review tool (`peakreel review`).
review:
  host: 127.0.0.1             # any other address (or public_hosts) requires `peakreel review password`
  port: 8765
  export_dir: export          # approved clips, under paths.data_dir
  public_hosts: []            # e.g. [pc.tail1234.ts.net] with `tailscale serve` (docs/m7-supervisor-review.md)
  session_days: 30            # how long a phone stays logged in
  auto:                       # automatic approve / reject (docs/auto-review.md)
    mode: shadow              # off | shadow (show only) | on (apply)
    reject_below_excitement: 0.15   # chat rules: share of top messages with an excited word
    approve_excitement: 0.5
    approve_score: 8          # chat spike score (without Gemini)
    reject_flags: [music]     # alerts and swearing go to a person (or to Gemini)
    daily_cap: 6              # auto-approvals per account per UTC day
    gemini_models: [gemini-4-hydrogen, gemini-3.8-flash, gemini-3.5-flash-lite]  # free tier, in order
    ai_approve: 7             # Gemini score (1-10) that may auto-approve
    ai_reject: 3              # ... and that auto-rejects
    ai_wait_min: 30           # then the chat rules decide alone
    ai_per_pass: 3            # Gemini calls per 30 s pass

# New-clip notifications.
notify:
  desktop: true               # Windows toast
  ntfy_server: https://ntfy.sh
  ntfy_topic: null            # set a long random topic to get phone pushes

# Flags for the reviewer (never auto-reject). Word lists: `peakreel safety download`;
# your own words go in safety.yaml. Calibrate with `peakreel safety scan <clips>`.
safety:
  languages: [en, pt, es, ja] # LDNOOBW lists applied to every clip
  word_lists_dir: safety      # under data_dir
  music_threshold: 0.35       # beat score; talk and gameplay measured 0.04-0.21
  alerts: true                # flag subs, gifts, cheers, raids (on-screen names)
  words: false                # blocked-word flag: off, GTA streams swear constantly

# Same moment on several channels (co-streams): keep the best clip, flag the rest.
# Check two clips with `peakreel safety compare a.mp4 b.mp4`.
dedupe:
  enabled: true
  window_s: 60                # compare clips starting this close together
  min_strength: 16            # audio match strength; unrelated <= 13.2, co-streams 14-45
  max_offset_s: 12            # stream delay differences searched

# Kick chat arrives through Kick's official webhooks, via a tunnel (docs/kick.md).
kick:
  webhook_host: 127.0.0.1
  webhook_port: 8770
  webhook_path: /kick/webhook
  public_url: null            # your tunnel's address, e.g. https://name.ngrok-free.app
  max_age_s: 600              # refuse webhook calls older than this

# Live state, game and title from Twitch, after `peakreel twitch login`.
golive:
  poll_s: 60

# Record the top live streamers of a Twitch category automatically, next to the
# channels above (docs/discovery.md). Needs `peakreel twitch login`.
# Check the choice first with `peakreel discover preview`.
discover:
  enabled: false
  platforms: [twitch]               # add kick after `peakreel kick setup` (docs/kick.md)
  category: "Grand Theft Auto VI"   # exact Twitch name
  kick_category: "Grand Theft Auto VI"  # exact Kick name
  max_channels: 10                  # recorded at once, manual channels included
  min_viewers: 500
  languages: null                   # null: the languages of publish.accounts
  refresh_min: 5
  keep_min: 20                      # grace before dropping one that fell out of the top
  permission: credit_only           # discovered streamers were not asked; unknown = never public
  exclude: []

# Publishing (M9). Approving a clip in the review tool queues it for each platform.
# `export` writes a ready-to-post package per platform under data/publish/ (manual
# upload); `private`/`public` need the platform adapters (M10-M12).
# Limits are enforced in each platform's own unit; they change, so check them.
publish:
  mode: export
  # Per-platform override: post through the platform's API once it is connected.
  # YouTube: `peakreel youtube setup/login` (docs/m10-youtube.md); Instagram and
  # Facebook Pages: `peakreel meta setup/login` (docs/m12-meta.md). TikTok exports.
  # modes:
  #   youtube: public           # or private (finish in YouTube Studio)
  #   instagram: public         # no private posts on Instagram
  #   facebook: public          # or private (Reel kept as a draft on the Page)
  platforms: [youtube, tiktok, instagram]   # default selection when approving
  hashtags: [twitch, clips]   # after the channel's and the game's hashtags
  game_hashtag: true          # #GrandTheftAutoVI from Twitch stream status
  # Your posting accounts, one per language. A clip goes to the account for its
  # language (the channel's `language`, else Twitch's broadcast language, else the
  # language heard in the clip; the reviewer can change it). A clip whose language
  # has no account is held for the reviewer. An account without `languages` would
  # take every other language. `credit` is the credit line in the account's language.
  accounts:
    # A Facebook Page per language (Instagram posts through it); no Japanese TikTok.
    - id: en
      name: English
      languages: [en]
      credit: "Clip from {channel_url}"
      platforms: [youtube, tiktok, instagram, facebook]
      handles: {youtube: sode.moments, tiktok: sode.moments, instagram: sode.moments}
    - id: es
      name: Español
      languages: [es]
      credit: "Clip de {channel_url}"
      platforms: [youtube, tiktok, instagram, facebook]
      handles: {youtube: sodeclips, tiktok: sode.clips, instagram: sode.clips}
    - id: pt
      name: Português
      languages: [pt]
      credit: "Clipe de {channel_url}"
      platforms: [youtube, tiktok, instagram, facebook]
      handles: {youtube: sode.clipes, tiktok: sode.clipes, instagram: sode.clipes}
    - id: ja
      name: 日本語
      languages: [ja]
      credit: "クリップ元: {channel_url}"
      platforms: [youtube, instagram, facebook]
      handles: {youtube: sode.jpclips, instagram: sode.jpclips}
    # Each account can also set: platforms (where it exists), handles (its own
    # names), hashtags, and templates (per-platform text in its language).
  max_attempts: 5
  retry_initial_s: 60
  youtube:                    # verified 2026-11-17
    title_max: 100
    text_max: 5000            # description, in UTF-8 bytes (API)
    text_unit: bytes
    tags_max_chars: 500       # commas and quotes count
    daily_cap: 10
    min_spacing_min: 30
  tiktok:
    text_max: 2200            # caption, in UTF-16 units (an emoji counts 2)
    text_unit: utf16
    daily_cap: 10
    min_spacing_min: 30
  instagram:
    text_max: 2200
    text_unit: chars
    hashtags_max: 5           # lowered from 30 in December 2025
    mentions_max: 20
    daily_cap: 10
    min_spacing_min: 30
  facebook:                   # Page Reels
    text_max: 2200
    text_unit: chars
    daily_cap: 10             # Meta allows 30 Reels per Page per day
    min_spacing_min: 30
  # templates:                # override post text; variables: {title} {description}
  #   tiktok:                 # {streamer} {channel} {game} {mention} {credit} {source}
  #     text: "{title}\n\n{credit} {mention}\n\n{hashtags}"   # must contain {credit}

# What is deleted, and when, so an unattended run never fills the disk (M8).
# Approved clips are never deleted; a purged clip keeps its database row and sidecar.
retention:
  rejected_days: 2            # rejected and taken-down clips
  new_days: 7                 # never reviewed (and duplicates)
  publish_days: 14            # export packages
  chat_days: 90               # chat logs (M2 labeling needs recent ones)
  min_free_gb: 20             # below this, oldest unapproved clips are purged early
  interval_min: 30

# Warnings in data/run/status.json and the review page's status bar (M8).
health:
  max_memory_mb: 3000
  max_handles: 5000           # a steady climb means a leak
  max_captions_backlog: 6
  max_clips_in_flight: 10

# Platform specs change. Edit here, not in code.
output:
  width: 1080
  height: 1920
  fps: 30
  video_codec: libx264
  pixel_format: yuv420p
  audio_codec: aac
  clip_min_s: 20
  clip_max_s: 45
  # Captions and credit stay out of the bottom 20% and the right 12% of the frame.
  safe_zone_bottom: 0.20
  safe_zone_right: 0.12

logging:
  level: INFO
  # Relative to paths.data_dir. JSON lines, rotated.
  file: logs/peakreel.jsonl
  max_bytes: 10485760
  backup_count: 5

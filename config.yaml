# Peakreel configuration: portable defaults.
#
# Machine-specific values (absolute tool paths, another data directory, your channel list)
# go in config.local.yaml next to this file. That file is gitignored and is deep-merged on
# top of this one: mappings merge key by key, lists and scalars are replaced.
#
# Relative paths are resolved against the directory that contains this file.

tools:
  # A bare command name is looked up next to the Python interpreter first (the project
  # virtualenv), then on PATH. `peakreel doctor` prints the resolved path.
  # Set absolute paths in config.local.yaml to pin exact binaries.
  ffmpeg: ffmpeg
  ffprobe: ffprobe
  streamlink: streamlink
  whisper_model_dir: models/whisper

paths:
  data_dir: data
  blocklist: blocklist.yaml

# Channels to watch. `credit` is the text burned into every clip from that channel.
# `facecam` (optional) switches the vertical render to a split layout: the facecam
# region, as fractions of the source frame, on top of the gameplay.
# Example:
#   - name: somestreamer
#     credit: "Clip from twitch.tv/somestreamer"
#     facecam: {x: 0.80, y: 0.58, w: 0.20, h: 0.32}
#     enabled: true              # false keeps it configured but not run
channels: []

chat:
  url: wss://irc-ws.chat.twitch.tv:443
  # Messages from these logins are flagged `filtered: bot` (still logged, so they replay).
  bots:
    - nightbot
    - streamelements
    - streamlabs
    - moobot
    - fossabot
    - wizebot
    - soundalerts
    - sery_bot
    - pokemoncommunitygame
    - botrixoficial
    - kofistreambot
    - tangiabot
    - blerp
    - own3d
  # Messages starting with one of these are flagged `filtered: command`.
  command_prefixes: ["!"]
  # Liveness: a websocket ping every `keepalive_interval_s`; no pong within
  # `keepalive_timeout_s` marks the connection stalled and forces a reconnect.
  # interval + timeout is the longest an outage can go unnoticed.
  keepalive_interval_s: 2.0
  keepalive_timeout_s: 3.0
  connect_timeout_s: 5.0
  # Reconnect backoff: initial * 2^attempt, capped at max, with jitter.
  reconnect_initial_delay_s: 0.5
  reconnect_max_delay_s: 8.0
  # Twitch allows 20 JOINs per 10 seconds for unauthenticated connections.
  join_batch_size: 20
  join_batch_interval_s: 10.5

# Spike detector (M2). Tune with `peakreel detect evaluate`; see docs/m2-detector.md.
detect:
  bucket_s: 10
  baseline_buckets: 30        # 5 min rolling baseline
  warmup_buckets: 12          # 2 min of data before anything can trigger
  floor: 10                   # messages per bucket, minimum
  k: 4.0                      # hot when count > median + k * MAD
  min_unique: 5
  merge_gap: 1
  max_event_s: 120
  cooldown_s: 60
  raid_suppress_s: 90
  sub_train_min: 5
  sub_train_window_s: 30
  min_unique_ratio: 0.3
  reset_after_downtime_s: 300
  top_messages: 5
  # Permissive overrides that build the label sheet (a superset of stricter settings).
  candidate:
    floor: 5
    k: 2.0
    min_unique: 3
    cooldown_s: 30

# Stream recorder and rolling buffer (M3). See docs/m3-recorder.md.
record:
  buffer_minutes: 10          # on the broadcast clock, per channel
  quality: best               # 1080p60 is ~1 MB/s, so ~600 MB per channel at 10 min
  offline_retry_s: 30
  prune_interval_s: 30

# Live clipper (M4). See docs/m4-clipper.md.
clip:
  pre_roll_s: 20              # video before the spike start (chat reacts late)
  post_roll_s: 10
  max_wait_s: 90              # wait this long for the buffer to cover the window
  concurrent_cuts: 1          # ffmpeg encodes at once
  outbox: outbox              # under paths.data_dir

# Vertical renderer (M5). See docs/m5-renderer.md.
render:
  font_file: null             # null = first installed CJK-capable font (Yu Gothic, Malgun, ...)
  font_name: null             # family name of a custom font_file, for captions
  preset: veryfast
  crf: 20
  audio_bitrate: 160k
  blur_sigma: 30
  facecam_height_fraction: 0.35   # split layout: facecam share of the height
  credit_max_font_px: 42
  margin_px: 48

# Speech captions (M6). See docs/m6-captions.md.
# Download the model once with `peakreel captions download`.
captions:
  enabled: true
  model: small                # faster-whisper; cached in tools.whisper_model_dir
  device: cpu
  compute_type: int8
  cpu_threads: 4              # leave cores for recording and encoding
  beam_size: 5                # greedy (1) drops whole segments on noisy game audio
  language: null              # null = detect per clip
  vad_filter: true
  min_words: 3                # fewer = "no speech", clip renders without captions
  max_line_chars: 20          # CJK characters count 2
  font_px: 64
  outline_px: 5
  highlight_color: "#FFE135"
  bottom_fraction: 0.70       # caption baseline; above the credit and the unsafe zone
  side_margin_px: 48
  linger_s: 0.3

# Supervision of `peakreel run start` (M7). See docs/m7-supervisor-review.md.
supervisor:
  require_allowlist: true     # only channels listed above (enabled) may run
  restart_initial_s: 5        # backoff for restarting a crashed channel component
  restart_max_s: 300
  blocklist_check_s: 30       # takedowns apply while running
  status_interval_s: 30       # data/run/status.json heartbeat

# Review tool (`peakreel review`).
review:
  host: 127.0.0.1             # no login: keep it local unless you mean otherwise
  port: 8765
  export_dir: export          # approved clips, under paths.data_dir

# New-clip notifications.
notify:
  desktop: true               # Windows toast
  ntfy_server: https://ntfy.sh
  ntfy_topic: null            # set a long random topic to get phone pushes

# Flags for the reviewer (never auto-reject). Word lists: `peakreel safety download`;
# your own words go in safety.yaml. Calibrate with `peakreel safety scan <clips>`.
safety:
  languages: [en, pt, es, ja] # LDNOOBW lists applied to every clip
  word_lists_dir: safety      # under data_dir
  music_threshold: 0.35       # beat score; talk and gameplay measured 0.04-0.21
  alerts: true                # flag subs, gifts, cheers, raids (on-screen names)

# Same moment on several channels (co-streams): keep the best clip, flag the rest.
# Check two clips with `peakreel safety compare a.mp4 b.mp4`.
dedupe:
  enabled: true
  window_s: 60                # compare clips starting this close together
  min_strength: 16            # audio match strength; unrelated <= 13.2, co-streams 14-45
  max_offset_s: 12            # stream delay differences searched

# Live state, game and title from Twitch, after `peakreel twitch login`.
golive:
  poll_s: 60

# Platform specs change. Edit here, not in code.
output:
  width: 1080
  height: 1920
  fps: 30
  video_codec: libx264
  pixel_format: yuv420p
  audio_codec: aac
  clip_min_s: 20
  clip_max_s: 45
  # Captions and credit stay out of the bottom 20% and the right 12% of the frame.
  safe_zone_bottom: 0.20
  safe_zone_right: 0.12

logging:
  level: INFO
  # Relative to paths.data_dir. JSON lines, rotated.
  file: logs/peakreel.jsonl
  max_bytes: 10485760
  backup_count: 5

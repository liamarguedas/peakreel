# Peakreel configuration: portable defaults.
#
# Machine-specific values (absolute tool paths, another data directory, your channel list)
# go in config.local.yaml next to this file. That file is gitignored and is deep-merged on
# top of this one: mappings merge key by key, lists and scalars are replaced.
#
# Relative paths are resolved against the directory that contains this file.

tools:
  # A bare command name is looked up next to the Python interpreter first (the project
  # virtualenv), then on PATH. `peakreel doctor` prints the resolved path.
  # Set absolute paths in config.local.yaml to pin exact binaries.
  ffmpeg: ffmpeg
  ffprobe: ffprobe
  streamlink: streamlink
  whisper_model_dir: models/whisper

paths:
  data_dir: data
  blocklist: blocklist.yaml

# Channels to watch. `credit` is the text burned into every clip from that channel.
# Example:
#   - name: somestreamer
#     credit: "Clip from twitch.tv/somestreamer"
channels: []

chat:
  url: wss://irc-ws.chat.twitch.tv:443
  # Messages from these logins are flagged `filtered: bot` (still logged, so they replay).
  bots:
    - nightbot
    - streamelements
    - streamlabs
    - moobot
    - fossabot
    - wizebot
    - soundalerts
    - sery_bot
    - pokemoncommunitygame
    - botrixoficial
    - kofistreambot
    - tangiabot
    - blerp
    - own3d
  # Messages starting with one of these are flagged `filtered: command`.
  command_prefixes: ["!"]
  # Liveness: a websocket ping every `keepalive_interval_s`; no pong within
  # `keepalive_timeout_s` marks the connection stalled and forces a reconnect.
  # interval + timeout is the longest an outage can go unnoticed.
  keepalive_interval_s: 2.0
  keepalive_timeout_s: 3.0
  connect_timeout_s: 10.0
  # Reconnect backoff: initial * 2^attempt, capped at max, with jitter.
  reconnect_initial_delay_s: 0.5
  reconnect_max_delay_s: 30.0
  # Twitch allows 20 JOINs per 10 seconds for unauthenticated connections.
  join_batch_size: 20
  join_batch_interval_s: 10.5

# Platform specs change. Edit here, not in code.
output:
  width: 1080
  height: 1920
  fps: 30
  video_codec: libx264
  pixel_format: yuv420p
  audio_codec: aac
  clip_min_s: 20
  clip_max_s: 45
  # Captions and credit stay out of the bottom 20% and the right 12% of the frame.
  safe_zone_bottom: 0.20
  safe_zone_right: 0.12

logging:
  level: INFO
  # Relative to paths.data_dir. JSON lines, rotated.
  file: logs/peakreel.jsonl
  max_bytes: 10485760
  backup_count: 5

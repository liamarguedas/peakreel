[project]
name = "peakreel"
version = "0.1.0"
description = "Detect Twitch chat spikes and turn them into captioned vertical clips."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Liam Arguedas" }]
dependencies = [
    "faster-whisper>=1.2.1",
    "keyring>=25.7.0",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "streamlink>=8.6.3",
    "structlog>=26.1.0",
    "typer>=0.29.1",
    "websockets>=17.4",
]

[project.scripts]
peakreel = "peakreel.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["peakreel"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "D", "PTH", "ASYNC", "S"]
ignore = [
    "D203", # conflicts with D211
    "D213", # conflicts with D212
    "S603", # subprocess with argument lists is the project rule; shell=True is never used
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S105", "S106", "S107", "S311"]

[tool.pyright]
include = ["peakreel", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Peakreel review</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%233a5bd9'/%3E%3Cpath d='M6 4.5v7l5.5-3.5z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --ink: #1b1b1a; --muted: #6b6a66; --line: #e3e2de;
    --accent: #3a5bd9; --on-accent: #fff; --bad: #b3261e;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1d1d1b; --ink: #ecebe7; --muted: #9c9b96; --line: #2f2e2b;
      --accent: #7d97ff; --on-accent: #141413; --bad: #ff8a80;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
         background: var(--bg); color: var(--ink);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", "Yu Gothic UI", sans-serif; }
  form { width: min(100%, 340px); background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
         padding: 22px; display: grid; gap: 14px; }
  h1 { margin: 0; font-size: 18px; letter-spacing: -0.01em; }
  label { font-size: 12px; color: var(--muted); display: grid; gap: 4px; }
  input { font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
          border-radius: 8px; padding: 9px 10px; width: 100%; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 10px 14px; cursor: pointer;
           background: var(--accent); color: var(--on-accent); }
  button:disabled { opacity: 0.6; cursor: default; }
  .error { margin: 0; min-height: 1.45em; font-size: 13px; color: var(--bad); }
</style>
</head>
<body>
<form id="login">
  <h1>Peakreel review</h1>
  <label>Password <input id="password" type="password" autocomplete="current-password" required autofocus></label>
  <p class="error" id="error" role="alert"></p>
  <button>Log in</button>
</form>
<script>
"use strict";
const form = document.getElementById("login");
const error = document.getElementById("error");
form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const button = form.querySelector("button");
  button.disabled = true;
  error.textContent = "";
  try {
    // A JSON body: other sites cannot send one without a CORS preflight, which this server never grants.
    const response = await fetch("/api/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: document.getElementById("password").value }),
    });
    if (response.ok) { location.replace("/"); return; }
    const detail = await response.json().catch(() => ({}));
    error.textContent = typeof detail.detail === "string" ? detail.detail : "Could not log in.";
  } catch {
    error.textContent = "The review page is not reachable.";
  }
  button.disabled = false;
});
</script>
</body>
</html>
